name: Desktop release (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-main
  cancel-in-progress: true

jobs:
  verify:
    name: Verify web app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  release-windows:
    name: Build Windows installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Verify versions and prepare release
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageVersion = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          $cargoVersionMatch = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1

          if (-not $cargoVersionMatch) {
            throw 'Could not read the package version from src-tauri/Cargo.toml.'
          }

          $cargoVersion = $cargoVersionMatch.Matches[0].Groups[1].Value

          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Version mismatch: package=$packageVersion, Tauri=$tauriVersion, Cargo=$cargoVersion."
          }

          $buildId = '${{ github.run_number }}.${{ github.run_attempt }}'
          $releaseTag = "desktop-v$packageVersion-build.$buildId"
          $releaseName = "Receiptly v$packageVersion (build $buildId)"

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$releaseTag" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "name=$releaseName" -Encoding utf8

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: ${{ steps.release.outputs.name }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            main 브랜치에서 자동으로 빌드된 Windows 설치 파일입니다.
            Windows에서는 -setup.exe 파일을 내려받아 실행하세요.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
